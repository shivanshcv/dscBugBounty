<div class="container">
    <div class="jumbotron mt-5">
        <h2>Leaderboard</h2> 
        <hr>
        <div class="row">
            <div class="col-2">Rank</div>
            <div class="col-2">Team No.</div>
            <div class="col">Team Name</div>
            <div class="col-md-4">Total Score</div>
        </div>
        <hr>
        <div class="row py-2" *ngFor="let team of teamArr; let i = index">
            <div class="col-2">{{i+1}}</div>
            <div class="col-2">{{team['teamNo']}}</div>
            <div class="col">{{team['teamName']}}</div>
            <div class="col-md-4">{{team['totalScore']}}</div>
        </div>
    </div>
</div>
