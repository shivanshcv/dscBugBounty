


<div id="container">
    <h2>DSC Admin</h2>
    <p>Please fill in this form to Log In.</p>
    <hr>
  <form [formGroup]="loginForm" >
  
      <div class="form-group">
        
        
  
        <label for="username">Username</label>
        <input type="text" placeholder="Enter Username" required class="form-control" name ="username" formControlName="username">
      
    </div>
    <div class="form-group">
        <label for="psw">Password</label>
        <input type="password" placeholder="Enter Password"class="form-control" name="psw" formControlName="password" required>
       
      </div>
        <div class="button">
          
          <button type="submit"class="btn btn-success" (click)="submit()">Log In</button>
          
        </div>
      
    </form>
