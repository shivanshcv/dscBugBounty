


<div class="container">
  <div class="jumbotron mt-5">
    <h2>Add Questions</h2>
    <p>Please fill in this form to add Questions</p>
    <button (click)="changepls()">Change pls</button>
    <hr>
  <form [formGroup]="questionAddForm" >
  
      <div class="form-group">
        
        
  
        <label for="questionNo">Question Number</label>
        <input type="text" placeholder="Enter Question No." required class="form-control" name ="questionNo" formControlName="questionNo">
      
    </div>
    <div class="form-group">
        <label for="question">Question</label>
        <input type="text" placeholder="Enter Question"class="form-control" name="question" formControlName="question" required>
       
      </div>
      <div class="form-group">
        <label for="answer">Answer</label>
        <input type="text" placeholder="Enter Answer"class="form-control" name="answer" formControlName="answer" required>
       
      </div>
      <div class="form-group">
        <label for="score">Score</label>
        <input type="text" placeholder="Enter Score"class="form-control" name="score" formControlName="score" >
       
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="text" placeholder="Enter Password"class="form-control" name="password" formControlName="password" required>
       
      </div>
        <div class="button">
          
          <button type="submit"class="btn btn-success" (click)="submit()">Add Question</button>
          
        </div>
      
    </form>
  </div>
</div>
