


<div id="container">
  
    <h2>Register</h2>
    <p>Please fill in this form to Register the Team.</p>
    <hr>
  <form [formGroup]="registerForm" >
  
      <div class="form-group">
        
        
  
        <label for="teamNo">Team No.</label>
        <input type="text" placeholder="Enter Team Number" required class="form-control" name ="teamNo" formControlName="teamNo">
      
    </div>
    <div class="form-group">
        
        
  
      <label for="email">Email</label>
      <input type="text" placeholder="Enter Team Lead Email" required class="form-control" name ="email" formControlName="email">
    
  </div>
    <div class="form-group">
        <label for="teamName">Team Name</label>
        <input type="text" placeholder="Enter Team Name"class="form-control" name="teamName" formControlName="teamName" required>
       
      </div>

        <div class="button">
          
          <button type="submit"class="btn btn-success" (click)="submit()">Register</button>
          
        </div>
      
    </form>
